<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#A5D6FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="236" fill="url(#bg-gradient)" stroke="url(#border-gradient)" stroke-width="1.5" rx="12" />

  <!-- Terminal Header Bar -->
  <path d="M 2,14 A 12,12 0 0,1 14,2 L 836,2 A 12,12 0 0,1 848,14 L 848,38 L 2,38 Z" fill="#161B22" />
  <line x1="2" y1="38" x2="848" y2="38" stroke="#30363D" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="20" r="6" fill="#FF5F56" />
  <circle cx="44" cy="20" r="6" fill="#FFBD2E" />
  <circle cx="64" cy="20" r="6" fill="#27C93F" />

  <!-- Terminal Window Title -->
  <text x="425" y="24" text-anchor="middle" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="12" fill="#8B949E">deepak@dev-box:~ (zsh)</text>

  <!-- Live Status Badge -->
  <g transform="translate(670, 52)">
    <rect x="0" y="0" width="145" height="26" fill="#21262D" rx="13" stroke="#30363D" stroke-width="1"/>
    <circle cx="16" cy="13" r="5" fill="#3FB950" />
    <text x="30" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" fill="#7EE787" font-weight="600">Open to Roles</text>
  </g>

  <!-- Main Name & Title -->
  <text x="40" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" fill="url(#text-gradient)">Hi, I'm Deepak Mali 👋</text>

  <!-- Subtitle -->
  <text x="40" y="122" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="15">
    <tspan fill="#58A6FF" font-weight="600">Software Engineer</tspan>
    <tspan fill="#8B949E"> • </tspan>
    <tspan fill="#8B5CF6" font-weight="600">Full-Stack</tspan>
    <tspan fill="#8B949E"> • </tspan>
    <tspan fill="#58A6FF" font-weight="600">Backend APIs</tspan>
    <tspan fill="#8B949E"> • </tspan>
    <tspan fill="#3FB950" font-weight="600">AI Systems</tspan>
  </text>

  <!-- Terminal Lines -->
  <g transform="translate(40, 158)" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="14">
    <text x="0" y="0">
      <tspan fill="#3FB950">❯ </tspan>
      <tspan fill="#58A6FF">current_focus</tspan>
      <tspan fill="#8B949E"> = </tspan>
      <tspan fill="#A5D6FF">["Full-Stack Web", "High-Perf Backends", "AI/LLMs", "Algorithms"]</tspan>
    </text>

    <text x="0" y="28">
      <tspan fill="#3FB950">❯ </tspan>
      <tspan fill="#58A6FF">status</tspan>
      <tspan fill="#8B949E"> = </tspan>
      <tspan fill="#7EE787">"Graduating B.Tech IT '27 @ DJSCE | Building software across the stack"</tspan>
    </text>
  </g>
</svg>
