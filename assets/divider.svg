<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 20" width="100%" height="20">
  <defs>
    <!-- Multi-color Gradient Pulse -->
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0" />
      <stop offset="20%" stop-color="#58A6FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="80%" stop-color="#3FB950" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Divider Line -->
  <line x1="0" y1="10" x2="850" y2="10" stroke="url(#divider-grad)" stroke-width="1.5" />
  
  <!-- Dashed Overlay for Terminal/Code Aesthetic -->
  <line x1="150" y1="10" x2="700" y2="10" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,8" />

  <!-- Center Diamond & Accent Nodes -->
  <circle cx="425" cy="10" r="4" fill="#8B5CF6" />
  <circle cx="425" cy="10" r="2" fill="#F0F6FC" />
  <circle cx="380" cy="10" r="2" fill="#58A6FF" opacity="0.8" />
  <circle cx="470" cy="10" r="2" fill="#3FB950" opacity="0.8" />
</svg>
