<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="848" height="68" fill="url(#card-bg)" stroke="#30363D" stroke-width="1" rx="10" />

  <!-- Metric 1 -->
  <g transform="translate(30, 20)" font-family="'Fira Code', Consolas, monospace">
    <text x="0" y="10" font-size="11" fill="#8B949E" letter-spacing="1">LEETCODE PEAK</text>
    <text x="0" y="32" font-size="15" fill="#F59E0B" font-weight="600">2127 Rating <tspan font-size="12" fill="#8B949E">(Guardian • Top 1.37%)</tspan></text>
  </g>

  <line x1="290" y1="15" x2="290" y2="55" stroke="#30363D" stroke-width="1" />

  <!-- Metric 2 -->
  <g transform="translate(320, 20)" font-family="'Fira Code', Consolas, monospace">
    <text x="0" y="10" font-size="11" fill="#8B949E" letter-spacing="1">PROBLEM SOLVING</text>
    <text x="0" y="32" font-size="15" fill="#58A6FF" font-weight="600">2,350+ Solved</text>
  </g>

  <line x1="560" y1="15" x2="560" y2="55" stroke="#30363D" stroke-width="1" />

  <!-- Metric 3 -->
  <g transform="translate(590, 20)" font-family="'Fira Code', Consolas, monospace">
    <text x="0" y="10" font-size="11" fill="#8B949E" letter-spacing="1">EXPERIENCE</text>
    <text x="0" y="32" font-size="15" fill="#8B5CF6" font-weight="600">SWE Intern @ UBS</text>
  </g>
</svg>
